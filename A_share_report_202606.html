
    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <title>2026年06月 A股交易及个股数据盘点</title>
        <style>
            body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f8f9fa; color: #333; }
            h1, h2 { color: #2c3e50; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
            .container { max-width: 1400px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
            table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 30px; font-size: 14px; }
            th, td { border: 1px solid #ddd; padding: 12px 15px; text-align: left; }
            th { background-color: #34495e; color: white; position: sticky; top: 0; }
            tr:nth-child(even) { background-color: #f2f2f2; }
            tr:hover { background-color: #e9ecef; }
            .positive { color: #e74c3c; font-weight: bold; } /* 红涨 */
            .negative { color: #27ae60; font-weight: bold; } /* 绿跌 */
            .scroll-table { max-height: 600px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>📊 A股数据盘点报告 (2026年06月)</h1>
            <p>生成时间: 2026-06-03 21:35:47</p>
            
            <h2>一、6月份大盘指数区间表现</h2>
            <p>暂无大盘数据</p>
            
            <h2>二、A股个股行情快照 (按今日涨跌幅降序)</h2>
            <div class="scroll-table">
                <p>暂无个股数据</p>
            </div>
        </div>
        
        <script>
            document.querySelectorAll('td').forEach(td => {
                if (td.innerText.includes('%')) {
                    let val = parseFloat(td.innerText);
                    if (val > 0) {
                        td.classList.add('positive');
                        td.innerText = '+' + td.innerText;
                    } else if (val < 0) {
                        td.classList.add('negative');
                    }
                }
            });
        </script>
    </body>
    </html>
